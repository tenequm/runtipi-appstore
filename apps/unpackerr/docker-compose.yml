services:
  unpackerr:
    image: ghcr.io/unpackerr/unpackerr:v1.0.1
    # The golift image runs as root by default and ignores PUID/PGID; 1000:1000 owns
    # app-data and the media tree.
    user: "1000:1000"
    volumes:
      - ${APP_DATA_DIR}/data:/config
      - ${ROOT_FOLDER_HOST}/media:/media
    environment:
      - TZ=${TZ}
      # hotio's UMASK=002 equivalent: extracted files stay group-writable for the *arr apps.
      - UN_FILE_MODE=0664
      - UN_DIR_MODE=0775
      - UN_WEBSERVER_LISTEN_ADDR=0.0.0.0:5656
      - UN_INTERVAL=2m
      - UN_START_DELAY=1m
      - UN_SONARR_main_NAME=Sonarr
      - UN_SONARR_main_URL=${SONARR_URL}
      - UN_SONARR_main_API_KEY=${SONARR_API_KEY}
      - UN_SONARR_main_PATHS_0=/media/torrents
      - UN_RADARR_main_NAME=Radarr
      - UN_RADARR_main_URL=${RADARR_URL}
      - UN_RADARR_main_API_KEY=${RADARR_API_KEY}
      - UN_RADARR_main_PATHS_0=/media/torrents
    x-runtipi:
      internal_port: 5656
      is_main: true
x-runtipi:
  schema_version: 2
