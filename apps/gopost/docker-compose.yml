services:
  gopost:
    # Built and pushed from the operator's machine with `just image <tag>`
    # (tenequm/gopost); distroless static image, amd64 only.
    image: ghcr.io/tenequm/gopost:v0.5.1
    environment:
      - GOPOST_LISTEN=:8080
      - GOPOST_DATA_DIR=/data
      - GOPOST_PUBLIC_URL=${GOPOST_PUBLIC_URL}
      - GOPOST_TOKEN=${GOPOST_TOKEN}
      - GOPOST_ENCRYPTION_KEY=${GOPOST_ENCRYPTION_KEY}
      - GOPOST_ADAPTER_ZERNIO_API_KEY=${GOPOST_ADAPTER_ZERNIO_API_KEY:-}
      - GOPOST_ACTIVE_DAYS=${GOPOST_ACTIVE_DAYS:-90}
      - GOPOST_TOKEN_RO=${GOPOST_TOKEN_RO:-}
      - GOPOST_INBOX_FIRST_WINDOW=${GOPOST_INBOX_FIRST_WINDOW:-720h}
      - GOPOST_PENDING_GIVE_UP=${GOPOST_PENDING_GIVE_UP:-24h}
      - GOPOST_BINDINGS_FILE=/data/bindings.json
      - GOPOST_ADAPTER_ZERNIO_WEBHOOK_SECRET=${GOPOST_ADAPTER_ZERNIO_WEBHOOK_SECRET:-}
      - GOPOST_REMOTE_GLIM_URL=http://gopost-exporter:8081
      - GOPOST_REMOTE_GLIM_TOKEN=${GOPOST_EXPORTER_TOKEN}
      - TZ=${TZ}
    volumes:
      - ${APP_DATA_DIR}/data:/data
    # Distroless image: no shell, no wget. The binary probes itself.
    healthcheck:
      test: ["CMD", "/gopost", "--health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    x-runtipi:
      internal_port: 8080
      is_main: true
  gopost-exporter:
    # Built and pushed with `just image-exporter <tag>`; same distroless
    # pattern, never exposed - gopost reaches it on the app network.
    image: ghcr.io/tenequm/gopost-exporter:v0.5.1
    environment:
      - EXPORTER_LISTEN=:8081
      - EXPORTER_TOKEN=${GOPOST_EXPORTER_TOKEN}
      - EXPORTER_GLIM_API_KEY=${GOPOST_GLIM_API_KEY:-}
      - EXPORTER_CACHE_DIR=/cache
      - EXPORTER_ACTIVE_DAYS=${GOPOST_EXPORTER_ACTIVE_DAYS:-30}
      - TZ=${TZ}
    volumes:
      - ${APP_DATA_DIR}/exporter-cache:/cache
    healthcheck:
      test: ["CMD", "/gopost-exporter", "--health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
x-runtipi:
  schema_version: 2
